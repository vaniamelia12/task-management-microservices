<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskFlow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <span class="logo">📋 TaskFlow</span>
                <h2>Buat Akun Baru</h2>
                <p>Mulai kelola tugas dengan lebih baik</p>
            </div>
            <div id="message" class="message"></div>
            <form id="registerForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" placeholder="budi_santoso" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="budi@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="minimal 6 karakter" required>
                </div>
                <button type="submit" class="btn-primary btn-full">Daftar Sekarang</button>
            </form>
            <p class="auth-footer">Sudah punya akun? <a href="login.html">Login</a></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
