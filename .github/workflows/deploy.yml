name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: 🧪 Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: 📦 Install dependencies & test User Service
        run: |
          cd user-service
          npm ci
          npm test || echo "No tests yet"
      
      - name: 📦 Check Task Service
        run: |
          cd task-service
          npm ci
          echo "Task Service ready"
      
      - name: 📦 Check Notification Service
        run: |
          cd notification-service
          npm ci
          echo "Notification Service ready"
      
      - name: 📦 Check API Gateway
        run: |
          cd api-gateway
          npm ci
          echo "API Gateway ready"

  docker-build:
    name: 🐳 Build Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: 🏗️ Build Docker Compose images
        run: |
          docker compose build
      
      - name: ✅ Build successful
        run: echo "All Docker images built successfully!"

  finish:
    name: ✅ Pipeline Status
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    if: always()
    
    steps:
      - name: 📢 Show results
        run: |
          echo "========================================="
          echo "CI/CD PIPELINE RESULTS"
          echo "========================================="
          echo "Tests: ${{ needs.test.result }}"
          echo "Docker Build: ${{ needs.docker-build.result }}"
          echo "========================================="
          
          if [[ "${{ needs.test.result }}" == "success" ]] && [[ "${{ needs.docker-build.result }}" == "success" ]]; then
            echo "🎉 All checks passed!"
          else
            echo "❌ Some checks failed. Please check logs."
          fi